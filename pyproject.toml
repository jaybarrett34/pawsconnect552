[project]
name = "pawsconnect-api"
version = "1.0.0"
description = "PawsConnect AI suite: FastAPI backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "pydantic>=2.8",
  "google-genai>=1.30",
  "httpx>=0.27",
  "orjson>=3.10",
  "pyjwt>=2.9",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "ruff>=0.16.10",
    "uvicorn[standard]>=0.30",
]

[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC"]
ignore = ["E701", "E702"]
per-file-ignores = { "api/paws/prompts.py" = ["E501"] }  # prompt text and few-shot JSON
